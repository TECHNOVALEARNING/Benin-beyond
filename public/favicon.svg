<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Royal Emerald Gradient Background -->
    <linearGradient id="bb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08221B" />
      <stop offset="50%" stop-color="#0D352A" />
      <stop offset="100%" stop-color="#051611" />
    </linearGradient>

    <!-- Imperial Gold Gradient for Monogram -->
    <linearGradient id="bb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C8" />
      <stop offset="35%" stop-color="#F2BA58" />
      <stop offset="70%" stop-color="#D78E27" />
      <stop offset="100%" stop-color="#9E6111" />
    </linearGradient>

    <!-- Secondary Soft Gold -->
    <linearGradient id="bb-gold-soft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D78E27" />
      <stop offset="100%" stop-color="#FCE1A2" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="bb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#E09F3E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Luxury Rounded Crest Container -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bb-bg)" stroke="url(#bb-gold)" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Subtle Internal Architectural Frame Ring -->
  <rect x="10" y="10" width="100" height="100" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />

  <!-- The "Bénin Beyond" Iconic Crest -->
  <g filter="url(#bb-glow)">
    <!-- Main Vertical Pillar of the "B" (Standing, Stability & Architecture) -->
    <path d="M34 26 C34 24.34 35.34 23 37 23 L44 23 C45.66 23 47 24.34 47 26 L47 94 C47 95.66 45.66 97 44 97 L37 97 C35.34 97 34 95.66 34 94 Z" fill="url(#bb-gold)" />

    <!-- Upper Loop of the "B" (Hospitality, Luxury Suites & Residences) -->
    <path d="M47 25 C58 25 74 27 74 41 C74 53 60 56 47 56" fill="none" stroke="url(#bb-gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lower Loop of the "B" Expanding "Beyond" into an aerodynamic wing (Mobility, Travel & Horizon) -->
    <path d="M47 56 C62 56 84 58 84 75 C84 92 63 95 47 95" fill="none" stroke="url(#bb-gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- The "Beyond" Dynamic Horizon Slash / Golden Wing through the center -->
    <path d="M40 56 L88 38" stroke="url(#bb-gold-soft)" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

    <!-- North Star / African Horizon Diamond of Excellence at top right -->
    <path d="M85 22 L87.5 28 L93.5 30.5 L87.5 33 L85 39 L82.5 33 L76.5 30.5 L82.5 28 Z" fill="url(#bb-gold)" />
  </g>
</svg>
