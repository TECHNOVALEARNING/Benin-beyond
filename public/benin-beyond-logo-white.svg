<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <!-- Royal Emerald Gradient Background -->
    <linearGradient id="bb-bg-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08221B" />
      <stop offset="50%" stop-color="#0D3B2E" />
      <stop offset="100%" stop-color="#041510" />
    </linearGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="bb-gold-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C8" />
      <stop offset="35%" stop-color="#F2BA58" />
      <stop offset="70%" stop-color="#D78E27" />
      <stop offset="100%" stop-color="#9E6111" />
    </linearGradient>

    <!-- Soft Gold Gradient -->
    <linearGradient id="bb-gold-soft-w" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D78E27" />
      <stop offset="100%" stop-color="#FCE1A2" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="bb-glow-w" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#E09F3E" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Emblème Iconique -->
  <g transform="translate(0, 0)">
    <!-- Cadre de Prestige arrondi -->
    <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bb-bg-w)" stroke="url(#bb-gold-w)" stroke-width="2.5" stroke-opacity="0.75" />

    <!-- Liseré architectural intérieur -->
    <rect x="10" y="10" width="100" height="100" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

    <!-- Emblème Signature Bénin Beyond -->
    <g filter="url(#bb-glow-w)">
      <!-- Pilier vertical de standing -->
      <path d="M34 26 C34 24.34 35.34 23 37 23 L44 23 C45.66 23 47 24.34 47 26 L47 94 C47 95.66 45.66 97 44 97 L37 97 C35.34 97 34 95.66 34 94 Z" fill="url(#bb-gold-w)" />

      <!-- Arche supérieure (Hospitalité) -->
      <path d="M47 25 C58 25 74 27 74 41 C74 53 60 56 47 56" fill="none" stroke="url(#bb-gold-w)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Arche inférieure (Mobilité & Horizon) -->
      <path d="M47 56 C62 56 84 58 84 75 C84 92 63 95 47 95" fill="none" stroke="url(#bb-gold-w)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Faisceau dynamique d'envol -->
      <path d="M40 56 L88 38" stroke="url(#bb-gold-soft-w)" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

      <!-- Étoile d'Excellence -->
      <path d="M85 22 L87.5 28 L93.5 30.5 L87.5 33 L85 39 L82.5 33 L76.5 30.5 L82.5 28 Z" fill="url(#bb-gold-w)" />
    </g>
  </g>

  <!-- Typographie Officielle "Bénin Beyond" version claire sur fond sombre -->
  <g transform="translate(140, 0)">
    <text x="0" y="68" font-family="'Urbanist', 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Bénin <tspan fill="url(#bb-gold-w)">Beyond</tspan>
    </text>

    <!-- Slogan Officiel -->
    <text x="2" y="98" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F2BA58" letter-spacing="3.5">
      HOSPITALITÉ &amp; MOBILITÉ D’EXCEPTION
    </text>
  </g>
</svg>
